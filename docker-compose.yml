# FLASHWEAR local development stack: PostgreSQL, Redis, Django and Celery.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
# For development this file bind-mounts the source tree over /app, so the stylesheet is
# compiled by the `frontend` service below and written into the shared static/css path.

services:
  db:
    image: postgres:16-alpine
    container_name: flashwear_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flashwear}
      POSTGRES_USER: ${POSTGRES_USER:-flashwear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashwear}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flashwear}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flashwear_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    container_name: flashwear_frontend
    working_dir: /app
    command: sh -c "npm install && npm run watch:css"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Watch every template so utility classes are regenerated on change.
      CHOKIDAR_USEPOLLING: "true"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashwear_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
      - logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      frontend:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashwear_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - .:/app
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  staticfiles:
  media:
  logs:
  frontend_node_modules: