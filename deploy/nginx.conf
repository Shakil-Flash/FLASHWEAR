# FLASHWEAR reverse proxy (mounted as /etc/nginx/conf.d/default.conf in
# docker-compose.prod.yml).
#
# Division of labour: nginx serves the manifest static bundle and user uploads as
# files off a shared volume, and proxies everything else to the Gunicorn container.
# Django still enforces its own security headers -- nginx does not duplicate them.
#
# TLS: terminate HTTPS in front of this server (an external load balancer, or add the
# usual `listen 443 ssl;` block with certificate paths and copy the location / block
# below). Once TLS is terminated upstream, X-Forwarded-Proto must say `https` so
# Django's SECURE_SSL_REDIRECT does not answer 301s to itself.

upstream flashwear_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # The largest body a client may send: support attachments, Loop galleries and
    # avatars all land under this. Django's own upload validators run regardless.
    client_max_body_size 25m;

    # Static: WhiteNoise manifest output (content-hashed filenames), safe to cache
    # forever. `immutable` tells the browser not to revalidate hashed URLs.
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media: user uploads. Hashed by Django's storage but not necessarily so; a week
    # is a compromise between freshness and load.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://flashwear_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # Reuse upstream connections instead of opening one per request.
        proxy_set_header Connection "";
        proxy_redirect off;
        # Longer than Gunicorn's own timeout so a slow request fails at the app
        # layer (where it is logged), not as a bare 502 from the proxy.
        proxy_read_timeout 60s;
    }
}
