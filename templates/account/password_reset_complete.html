{% extends "base.html" %}

{% block title %}Password changed — {{ site_name|default:'FLASHWEAR' }}{% endblock title %}

{% block content %}
<section class="mx-auto flex w-full max-w-lg flex-col justify-center px-4 py-16 sm:px-6 lg:px-8">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-soft sm:p-8">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-950">Password changed</h1>
        <p class="mt-2 text-sm text-slate-600">You are signed in on this device.</p>
        <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-center">
            <a href="{% url 'account:dashboard' %}" class="inline-flex items-center justify-center rounded-full bg-flash-600 px-5 py-2.5 text-sm font-semibold text-white shadow-soft transition hover:bg-flash-700 focus:outline-none focus:ring-2 focus:ring-flash-500/30 focus:ring-offset-2 focus:ring-offset-white">Go to your account</a>
            <a href="{% url 'account:security' %}" class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-800 shadow-soft transition hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-flash-500/20 focus:ring-offset-2 focus:ring-offset-white">Security settings</a>
        </div>
    </div>
</section>
{% endblock content %}
