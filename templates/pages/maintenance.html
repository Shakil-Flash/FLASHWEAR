{% extends "base.html" %}

{% block title %}Maintenance — {{ site_name|default:'FLASHWEAR' }}{% endblock title %}

{% block content %}
<section class="mx-auto flex max-w-3xl flex-col items-center justify-center px-4 py-24 text-center sm:px-6 lg:px-8">
    <div class="space-y-6">
        <p class="text-sm font-semibold uppercase tracking-[0.16em] text-flash-600">Under maintenance</p>
        <h1 class="text-4xl font-semibold tracking-tight text-slate-950 sm:text-5xl">
            We're refreshing the storefront
        </h1>
        <p class="text-lg leading-relaxed text-slate-600">
            FLASHWEAR is undergoing scheduled improvements. Please check back shortly.
        </p>
        <a href="{% url 'core:home' %}" class="inline-flex items-center justify-center rounded-full bg-flash-600 px-6 py-2.5 text-sm font-semibold text-white shadow-soft transition hover:bg-flash-700">
            Try again
        </a>
    </div>
</section>
{% endblock content %}
