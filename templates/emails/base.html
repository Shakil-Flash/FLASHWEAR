{% comment %}
Shared email layout for Phase 17 notifications. Inline styles only (mail clients strip
<style> blocks), table-based structure, one CTA -- the same visual identity as
support/email/notification.html and accounts/email/: slate card on a light background,
FLASH orange (#ea580c) pill button, quiet footer with the preference links.

Domain templates extend this and override the blocks; anything a block does not set falls
back to the notification's own title/body, so a two-line domain template still sends a
complete email. Unsubscribe appears only when the dispatcher put a token on the context
(marketing categories), never for mandatory ones -- offering it would be a lie.
{% endcomment %}
{# djlint:off H021,H030,H006,H031 #}
{% load i18n %}<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ notification_title }}{% endblock title %}</title>
</head>

<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;border:1px solid #e2e8f0;">
                    <tr>
                        <td style="padding:32px 32px 8px 32px;">
                            <p style="margin:0;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#64748b;">{% block eyebrow %}{% translate "FLASHWEAR" %}{% endblock eyebrow %}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 0 32px;">
                            <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;font-weight:600;color:#0f172a;">{% block heading %}{{ notification_title }}{% endblock heading %}</h1>
                            {% block content %}
                            <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#334155;">{{ notification_body }}</p>
                            {% endblock content %}
                        </td>
                    </tr>
                    {% block cta %}
                    {% if action_url %}
                    <tr>
                        <td align="center" style="padding:20px 32px 8px 32px;">
                            <a href="{{ action_url }}" style="display:inline-block;background-color:#ea580c;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:13px 28px;border-radius:9999px;">{% block cta_label %}{% translate "View details" %}{% endblock cta_label %}</a>
                        </td>
                    </tr>
                    {% endif %}
                    {% endblock cta %}
                    <tr>
                        <td style="padding:16px 32px 32px 32px;">
                            <p style="margin:0 0 8px 0;font-size:12px;line-height:1.6;color:#94a3b8;">
                                <a href="{{ preferences_url }}" style="color:#64748b;">{% translate "Manage preferences" %}</a>{% if unsubscribe_url %} · <a href="{{ unsubscribe_url }}" style="color:#64748b;">{% translate "Unsubscribe" %}</a>{% endif %}
                            </p>
                            <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">{% translate "FLASHWEAR — Fashion Beyond Ordinary" %}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
{# djlint:on #}
