{% comment %}
Support notification body. Inline styles only: mail clients strip <style> blocks, ignore
external stylesheets and never read metadata, so this stays self-contained the same way
accounts/email/verification_email.html does. djlint's H021 and H030 do not apply to a
transactional body.
{% endcomment %}
{# djlint:off H021,H030 #}
{% load i18n %}<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ headline }}</title>
</head>

<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;border:1px solid #e2e8f0;">
                    <tr>
                        <td style="padding:32px 32px 8px 32px;">
                            <p style="margin:0;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#64748b;">{% translate "FLASHWEAR Support" %}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:8px 32px 0 32px;">
                            <h1 style="margin:0 0 16px 0;font-size:22px;line-height:1.3;font-weight:600;color:#0f172a;">{{ headline }}</h1>
                            <p style="margin:0 0 8px 0;font-size:15px;line-height:1.6;color:#334155;">
                                <strong>{{ ticket.number }}</strong> — {{ ticket.subject }}
                            </p>
                            <p style="margin:0 0 4px 0;font-size:13px;line-height:1.6;color:#64748b;">
                                {% translate "Status" %}: {{ ticket.get_status_display }} · {% translate "Category" %}: {{ ticket.get_category_display }}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:20px 32px 24px 32px;">
                            <a href="{{ base_url }}{{ ticket_path }}" style="display:inline-block;background-color:#ea580c;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:13px 28px;border-radius:9999px;">
                                {% if staff_view %}{% translate "Open on the desk" %}{% else %}{% translate "Open your ticket" %}{% endif %}
                            </a>
                            <p style="margin:20px 0 0 0;font-size:12px;line-height:1.6;color:#64748b;word-break:break-all;">
                                <a href="{{ base_url }}{{ ticket_path }}" style="color:#64748b;">{{ base_url }}{{ ticket_path }}</a>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:0 32px 32px 32px;">
                            <p style="margin:0 0 12px 0;font-size:13px;line-height:1.6;color:#64748b;">
                                {% translate "Reply from that page and the whole conversation stays on the ticket. If you were not expecting this message, you can ignore it — nothing changes without you." %}
                            </p>
                            <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">{% translate "FLASHWEAR — Fashion Beyond Ordinary" %}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
{# djlint:on #}
