{% comment %}
Date-window switcher. Links, not a form: ``range`` is the only parameter this partial
owns, and ``query_transform`` carries every other filter the operator already set.
{% endcomment %}
{% load catalog_extras %}
<nav class="flex flex-wrap items-center gap-1.5" aria-label="Date range">
    {% for key, label in range_choices %}
        <a href="{% query_transform range=key page=1 %}" class="rounded-full px-3 py-1 text-sm transition {% if current_range == key %}bg-slate-900 dark:bg-amber-500 font-medium text-white dark:text-slate-950 shadow-xs{% else %}border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:border-slate-900 dark:hover:border-slate-500{% endif %}" {% if current_range == key %}aria-current="true"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>
