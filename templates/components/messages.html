{% if messages %}
    <div class="mx-auto max-w-7xl px-4 pt-6 sm:px-6 lg:px-8">
        <div class="space-y-3">
            {% for message in messages %}
                <div class="flex items-start gap-3 rounded-2xl border px-4 py-3 shadow-soft {% if message.tags == 'success' %} border-emerald-200 bg-emerald-50 text-emerald-900 dark:border-emerald-800/60 dark:bg-emerald-950/40 dark:text-emerald-200 {% elif message.tags == 'warning' %} border-amber-200 bg-amber-50 text-amber-900 dark:border-amber-800/60 dark:bg-amber-950/40 dark:text-amber-200 {% elif message.tags == 'error' or message.tags == 'danger' %} border-rose-200 bg-rose-50 text-rose-900 dark:border-rose-800/60 dark:bg-rose-950/40 dark:text-rose-200 {% else %} border-slate-200 bg-white text-slate-900 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100 {% endif %}"
                     role="alert"
                     x-data="{ show: true }"
                     x-show="show">
                    <div class="flex-1 text-sm leading-relaxed">
                        {{ message }}
                    </div>
                    <button type="button" @click="show = false" class="-m-1 rounded-full p-1.5 transition hover:bg-black/5 dark:hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-black/10 dark:focus:ring-white/20" aria-label="Dismiss">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
                            <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
                        </svg>
                    </button>
                </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
