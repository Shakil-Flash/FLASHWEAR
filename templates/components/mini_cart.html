<div x-data="{
    open: false,
    loading: false,
    checkoutUrl: '/shop/' + 'checkout/',
    cart: {
        is_empty: true,
        items: [],
        totals: {
            item_count: {{ cart_count|default:0 }},
            total_quantity: 0,
            subtotal: '0.00',
            currency: 'USD'
        },
        free_shipping_threshold: '100.00',
        amount_for_free_shipping: '100.00'
    },
    async loadMiniCart() {
        this.loading = true;
        try {
            const res = await fetch('{% url 'shop:cart-mini' %}', {
                headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
                this.cart = await res.json();
            }
        } catch (err) {
            console.error('Error fetching mini cart:', err);
        } finally {
            this.loading = false;
        }
    },
    openCart() {
        this.open = true;
        this.loadMiniCart();
    },
    closeCart() {
        this.open = false;
    },
    toggleCart() {
        if (this.open) {
            this.closeCart();
        } else {
            this.openCart();
        }
    }
}"
@open-mini-cart.window="openCart()"
@toggle-mini-cart.window="toggleCart()"
@cart-updated.window="openCart()"
@keydown.escape.window="closeCart()"
class="relative z-50">

    <!-- Backdrop -->
    <div x-show="open"
         x-cloak
         x-transition:enter="transition-opacity ease-out duration-300 motion-reduce:transition-none"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition-opacity ease-in duration-200 motion-reduce:transition-none"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="closeCart()"
         class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm"
         aria-hidden="true">
    </div>

    <!-- Slide-over Drawer -->
    <div x-show="open"
         x-cloak
         x-transition:enter="transition ease-out duration-300 transform motion-reduce:transition-none"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-200 transform motion-reduce:transition-none"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full"
         class="fixed inset-y-0 right-0 flex max-w-full pl-10"
         role="dialog"
         aria-modal="true"
         aria-labelledby="mini-cart-title">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
            <!-- Header -->
            <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
                <div class="flex items-center gap-2">
                    <h2 id="mini-cart-title" class="text-base font-semibold tracking-tight text-slate-900">Your Bag</h2>
                    <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-600"
                          x-text="(cart.totals ? cart.totals.item_count : 0) + ' items'">
                        {{ cart_count|default:0 }} items
                    </span>
                </div>
                <button type="button"
                        @click="closeCart()"
                        class="rounded-full p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 focus:outline-none focus:ring-2 focus:ring-flash-500"
                        aria-label="Close bag drawer">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Free shipping meter -->
            <div class="border-b border-slate-100 bg-slate-50/70 px-6 py-3">
                <template x-if="parseFloat(cart.amount_for_free_shipping || '0') <= 0">
                    <div class="flex items-center gap-2 text-xs font-medium text-emerald-700">
                        <svg class="h-4 w-4 shrink-0 text-emerald-600" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                        </svg>
                        <span>You've unlocked <strong>Free Standard Shipping</strong>!</span>
                    </div>
                </template>
                <template x-if="parseFloat(cart.amount_for_free_shipping || '0') > 0">
                    <div>
                        <div class="flex items-center justify-between text-xs text-slate-600">
                            <span>Free shipping threshold</span>
                            <span>Add <strong class="text-slate-900" x-text="'$' + cart.amount_for_free_shipping"></strong> more</span>
                        </div>
                        <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
                            <div class="h-full bg-flash-600 transition-all duration-300"
                                 :style="'width: ' + Math.min(100, Math.max(5, (1 - (parseFloat(cart.amount_for_free_shipping || 100) / 100)) * 100)) + '%'"></div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Items container -->
            <div class="flex-1 overflow-y-auto px-6 py-4">
                <div x-show="loading" class="flex justify-center py-12 text-slate-400">
                    <svg class="h-6 w-6 animate-spin text-flash-600" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                </div>

                <div x-show="!loading && (!cart.items || cart.items.length === 0)" class="py-16 text-center">
                    <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                    </svg>
                    <p class="mt-3 text-sm font-medium text-slate-900">Your bag is empty</p>
                    <p class="mt-1 text-xs text-slate-500">Discover our signature drops and essential pieces.</p>
                    <a href="{% url 'catalog:product-list' %}"
                       @click="closeCart()"
                       class="mt-4 inline-flex items-center justify-center rounded-full bg-slate-900 px-4 py-2 text-xs font-semibold text-white shadow-soft transition hover:bg-slate-800">
                        Explore Shop
                    </a>
                </div>

                <ul x-show="!loading && cart.items && cart.items.length > 0" class="divide-y divide-slate-100">
                    <template x-for="item in cart.items" :key="item.id">
                        <li class="flex gap-4 py-4">
                            <a :href="item.product_url" class="h-20 w-16 shrink-0 overflow-hidden rounded-lg bg-slate-100 border border-slate-200">
                                <template x-if="item.image_url">
                                    <img :src="item.image_url" :alt="item.product_name" class="h-full w-full object-cover" />
                                </template>
                                <template x-if="!item.image_url">
                                    <div class="flex h-full w-full items-center justify-center text-[10px] text-slate-400">
                                        No image
                                    </div>
                                </template>
                            </a>
                            <div class="flex flex-1 flex-col justify-between">
                                <div class="flex justify-between gap-2">
                                    <div>
                                        <h3 class="text-xs font-semibold text-slate-900">
                                            <a :href="item.product_url" x-text="item.product_name" class="hover:underline"></a>
                                        </h3>
                                        <p class="mt-0.5 text-xs text-slate-500" x-text="item.option_label"></p>
                                    </div>
                                    <p class="text-xs font-semibold text-slate-950" x-text="'$' + item.line_total"></p>
                                </div>
                                <div class="mt-2 flex items-center justify-between text-xs text-slate-500">
                                    <span x-text="'Qty: ' + item.quantity"></span>
                                    <a href="{% url 'shop:cart' %}" class="text-xs text-flash-600 hover:underline">Edit</a>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Footer summary & actions -->
            <div x-show="cart.items && cart.items.length > 0" class="border-t border-slate-100 bg-slate-50 p-6">
                <div class="flex items-baseline justify-between text-sm">
                    <span class="font-medium text-slate-600">Subtotal</span>
                    <span class="text-base font-semibold text-slate-950" x-text="'$' + (cart.totals ? cart.totals.subtotal : '0.00')"></span>
                </div>
                <p class="mt-1 text-xs text-slate-500">Shipping, discounts & taxes calculated at checkout.</p>
                <div class="mt-4 grid grid-cols-2 gap-3">
                    <a href="{% url 'shop:cart' %}"
                       class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-4 py-2.5 text-xs font-semibold text-slate-700 shadow-soft transition hover:border-slate-900 hover:text-slate-900">
                        View Bag
                    </a>
                    <a :href="checkoutUrl"
                       class="inline-flex items-center justify-center rounded-full bg-flash-600 px-4 py-2.5 text-xs font-semibold text-white shadow-soft transition hover:bg-flash-700 focus:outline-none focus:ring-2 focus:ring-flash-500/30">
                        Checkout
                    </a>
                </div>
                <div class="mt-3 flex items-center justify-center gap-3 text-[11px] text-slate-400">
                    <span class="flex items-center gap-1">
                        <svg class="h-3.5 w-3.5 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Secure Checkout
                    </span>
                    <span>•</span>
                    <span>30-Day Returns</span>
                </div>
            </div>
        </div>
    </div>
</div>
